<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#12110D;font-family:'Bricolage Grotesque',sans-serif;-webkit-font-smoothing:antialiased;color:#F6F3EC}
a{color:#FFD25A}a:hover{color:#FFF2C4}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 40%, #24221A 0, #0B0A07 75%)">
  <div style="flex:none;height:62px;display:flex;align-items:center;gap:10px;padding:0 16px">
    <span style="font:700 11px 'JetBrains Mono',monospace;letter-spacing:.16em;padding:5px 8px;border:1.5px solid #F6F3EC">ALAN</span>
    <sc-if value="{{ dogru }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ cevir }}" style="height:38px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,210,90,.55);background:rgba(255,210,90,.1);color:#FFD25A;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px"><span style="display:inline-block;width:12px;height:18px;border:2px solid currentColor;border-radius:3px;box-sizing:border-box;transform:rotate({{ ikonRot }});transition:transform .3s"></span>{{ cevirTxt }}</button>
    </sc-if>
    <button onClick="{{ yenile }}" style="height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(246,243,236,.2);background:transparent;font-size:14px;font-weight:600;cursor:pointer">Baştan</button>
  </div>
  <div ref="{{ alanRef }}" style="flex:1;min-height:0;width:100%;position:relative;overflow:hidden">
    <div style="position:absolute;left:50%;top:50%;width:390px;height:844px;margin:-422px 0 0 -195px;transform:scale({{ olcek }}) rotate({{ rot }});transition:transform .55s cubic-bezier(.3,.7,.2,1)">
      <div style="position:absolute;inset:0;border-radius:58px;background:#050505;box-shadow:0 40px 90px rgba(0,0,0,.6),inset 0 0 0 2px #2E2C26"></div>
      <div style="position:absolute;inset:11px;border-radius:47px;overflow:hidden;background:#0E0D09">
        <div style="position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font-size:15px;font-weight:600;pointer-events:none"><span>9:41</span><span style="position:absolute;left:50%;top:9px;width:118px;height:32px;margin-left:-59px;border-radius:18px;background:#000"></span><span style="font:600 11px 'JetBrains Mono',monospace">5G ▮▮</span></div>
        <div style="position:absolute;left:50%;top:calc(50% + 11px);width:{{ ifW }};height:{{ ifH }};transform:translate(-50%,-50%) rotate({{ geriRot }});transition:transform .55s cubic-bezier(.3,.7,.2,1)">
          <iframe key="{{ anahtar }}" src="telefon-oyun.html" title="ALAN" allow="fullscreen" style="position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#0E0D09"></iframe>
        </div>
        <div style="position:absolute;left:0;right:0;bottom:0;height:22px;display:flex;align-items:center;justify-content:center;pointer-events:none"><span style="width:130px;height:5px;border-radius:3px;background:rgba(246,243,236,.7)"></span></div>
      </div>
    </div>
  </div>
  <span style="flex:none;padding:0 16px 14px;font-size:12.5px;color:rgba(246,243,236,.5);text-align:center">{{ alt }}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ekran: 'rakip', yatay: false, n: 0 };
  alanRef = React.createRef();
  componentDidMount() { this.ro = new ResizeObserver(() => this.forceUpdate()); if (this.alanRef.current) this.ro.observe(this.alanRef.current);
    this.onMsg = e => { const d = e.data; if (d && d.tip === 'alan-ekran') { this.setState({ ekran: d.ekran }); } }; addEventListener('message', this.onMsg); setTimeout(() => this.forceUpdate(), 50); }
  componentWillUnmount() { if (this.ro) this.ro.disconnect(); removeEventListener('message', this.onMsg); }
  renderVals() {
    const S = this.state, Y = S.yatay, el = this.alanRef.current, aw = el ? el.clientWidth : 800, ah = el ? el.clientHeight : 800, bw = Y ? 844 : 390, bh = Y ? 390 : 844;
    const olcek = Math.max(.3, Math.min(1.2, (aw - 32) / bw, (ah - 24) / bh));
    /* çerçeve döner; ekran içeriği ters yöne döner ve yatay boyuta geçer, böylece oyun gerçek yatay pencere görür */
    const ekW = 368, ekH = 822, ifW = Y ? ekH - 44 - 22 : ekW, ifH = Y ? ekW : ekH - 44 - 22;
    return { alanRef: this.alanRef, olcek: olcek.toFixed(3), rot: Y ? '90deg' : '0deg', geriRot: Y ? '-90deg' : '0deg', ifW: ifW + 'px', ifH: ifH + 'px', anahtar: String(S.n),
      dogru: true, ikonRot: Y ? '0deg' : '90deg', cevirTxt: Y ? 'Dik tut' : 'Yan çevir', cevir: () => this.setState({ yatay: !S.yatay }),
      alt: Y ? 'Yatay · saha solda, kontroller sağda · maçta yayın görünümü' : 'Dikey · tek elle · oyuncuyu sürükle, dokun, Maça çık',
      yenile: () => this.setState(s => ({ n: s.n + 1, ekran: 'rakip' })) };
  }
}
</script>
</body>
</html>
