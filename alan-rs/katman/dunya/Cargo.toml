[package]
name = "alan-dunya"
version = "0.1.0"
edition = "2021"
description = "ALAN motorunun dunya katmanı (MIMARI.md 2.1, Aşama 7c)"

[lib]
name = "alan_dunya"
path = "lib.rs"

[dependencies]
alan-temel = { path = "../temel" }
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1.3"
serde_json = { version = "1", features = ["float_roundtrip"] }
