[package]
name = "alan-motor"
version = "0.1.0"
edition = "2021"
description = "ALAN maç motoru (JS motorundan, yalnız bugünkü davranış)"

[lib]
name = "alan_motor"

[dependencies]
alan-temel = { path = "../katman/temel" }
alan-kural = { path = "../katman/kural" }
alan-dunya = { path = "../katman/dunya" }
alan-kafa = { path = "../katman/kafa" }
alan-sekil = { path = "../katman/sekil" }
alan-mac = { path = "../katman/mac" }
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1.3"
serde_json = { version = "1", features = ["float_roundtrip"] }
