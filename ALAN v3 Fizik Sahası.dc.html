<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E5DC;color:#16150F;font-family:'Bricolage Grotesque',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#1F3FD1}a:hover{color:#E0531F}
button,select{font:inherit;color:inherit}
input[type=range]{accent-color:#16150F;width:100%;margin:0}
</style>
<script src="alan-v3/core.js"></script>
</helmet>
<div style="max-width:1680px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box">
  <header style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px;background:#16150F;color:#F6F3EC;padding:14px 20px">
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap">
      <span style="font-size:28px;font-weight:800;letter-spacing:-.02em">ALAN v3</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85">Katman 1–2 · Çekirdek fiziği ve karşılama</span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <sc-for list="{{ modes }}" as="md" hint-placeholder-count="4">
        <button onClick="{{ md.set }}" style="background:{{ md.bg }};color:{{ md.fg }};border:1.5px solid #F6F3EC;padding:7px 12px;cursor:pointer">{{ md.label }}</button>
      </sc-for>
    </div>
  </header>

  <div style="display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start">
    <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
      <div style="font-size:16px;line-height:1.4;text-wrap:pretty">{{ hint }}</div>
      <canvas ref="{{ cv }}" onMouseDown="{{ down }}" onMouseMove="{{ move }}" onMouseUp="{{ up }}" onMouseLeave="{{ up }}" width="1000" height="500" style="width:100%;aspect-ratio:2/1;display:block;background:#F6F3EC;border:2px solid #16150F;cursor:crosshair;touch-action:none"></canvas>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:2px solid #16150F;background:#F6F3EC">
        <sc-for list="{{ stats }}" as="s" hint-placeholder-count="5">
          <div style="padding:10px 12px;border-right:1.5px solid #16150F">
            <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7">{{ s.k }}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600">{{ s.v }}</div>
          </div>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px">
        <div style="border:2px solid #16150F;background:#F6F3EC;padding:10px 12px">
          <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:6px">Hız (koyu) ve enerji (açık) · zaman</div>
          <canvas ref="{{ cg }}" width="800" height="140" style="width:100%;height:140px;display:block"></canvas>
        </div>
        <div style="border:2px solid #16150F;background:#F6F3EC;padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.5;max-height:160px;overflow:auto">
          <sc-for list="{{ log }}" as="e" hint-placeholder-count="3">
            <div style="display:flex;gap:10px"><span style="opacity:.6;min-width:44px">{{ e.t }}</span><span>{{ e.txt }}</span></div>
          </sc-for>
        </div>
      </div>
    </div>

    <aside style="display:flex;flex-direction:column;gap:14px">
      <div style="border:2px solid #16150F;background:#F6F3EC;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7">Hazır denemeler</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          <sc-for list="{{ presets }}" as="p" hint-placeholder-count="5">
            <button onClick="{{ p.run }}" style="background:transparent;color:#16150F;border:1.5px solid #16150F;padding:6px 10px;cursor:pointer;font-size:14px">{{ p.label }}</button>
          </sc-for>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button onClick="{{ reset }}" style="background:#16150F;color:#F6F3EC;border:1.5px solid #16150F;padding:6px 10px;cursor:pointer;font-size:14px">Çekirdeği ortala</button>
          <button onClick="{{ clearSrc }}" style="background:transparent;border:1.5px solid #16150F;padding:6px 10px;cursor:pointer;font-size:14px">Oyuncuları sil</button>
          <button onClick="{{ togglePause }}" style="background:transparent;border:1.5px solid #16150F;padding:6px 10px;cursor:pointer;font-size:14px">{{ pauseLabel }}</button>
        </div>
      </div>
      <div style="border:2px solid #16150F;background:#F6F3EC;padding:12px 14px;display:flex;flex-direction:column;gap:12px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7">Fırlatma</div>
        <sc-for list="{{ launchSliders }}" as="s" hint-placeholder-count="3">
          <label style="display:flex;flex-direction:column;gap:4px;font-size:14px">
            <span style="display:flex;justify-content:space-between"><span>{{ s.label }}</span><span style="font-family:'JetBrains Mono',monospace">{{ s.disp }}</span></span>
            <input type="range" min="{{ s.min }}" max="{{ s.max }}" step="{{ s.step }}" value="{{ s.val }}" onChange="{{ s.set }}" onInput="{{ s.set }}">
          </label>
        </sc-for>
        <div style="display:flex;gap:6px">
          <sc-for list="{{ teamBtns }}" as="b" hint-placeholder-count="2">
            <button onClick="{{ b.set }}" style="flex:1;background:{{ b.bg }};color:{{ b.fg }};border:1.5px solid {{ b.bd }};padding:6px 10px;cursor:pointer;font-size:14px">{{ b.label }}</button>
          </sc-for>
        </div>
      </div>
      <div style="border:2px solid #16150F;background:#F6F3EC;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7">Son fırlatmayı 200 kez dene</div>
        <button onClick="{{ monte }}" style="background:#16150F;color:#F6F3EC;border:1.5px solid #16150F;padding:6px 10px;cursor:pointer;font-size:14px">Dağılımı ölç</button>
        <sc-for list="{{ monteRes }}" as="r" hint-placeholder-count="0">
          <div style="display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:14px"><span>{{ r.k }}</span><span style="font-weight:600">{{ r.v }}</span></div>
        </sc-for>
      </div>
      <div style="border:2px solid #16150F;background:#F6F3EC;padding:12px 14px;display:flex;flex-direction:column;gap:12px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7">Karşılama (katman 2)</div>
        <sc-for list="{{ qSliders }}" as="s" hint-placeholder-count="6">
          <label style="display:flex;flex-direction:column;gap:4px;font-size:14px">
            <span style="display:flex;justify-content:space-between"><span>{{ s.label }}</span><span style="font-family:'JetBrains Mono',monospace">{{ s.disp }}</span></span>
            <input type="range" min="{{ s.min }}" max="{{ s.max }}" step="{{ s.step }}" value="{{ s.val }}" onChange="{{ s.set }}" onInput="{{ s.set }}">
          </label>
        </sc-for>
      </div>
      <div style="border:2px solid #16150F;background:#F6F3EC;padding:12px 14px;display:flex;flex-direction:column;gap:12px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7">Fizik</div>
        <sc-for list="{{ physSliders }}" as="s" hint-placeholder-count="8">
          <label style="display:flex;flex-direction:column;gap:4px;font-size:14px">
            <span style="display:flex;justify-content:space-between"><span>{{ s.label }}</span><span style="font-family:'JetBrains Mono',monospace">{{ s.disp }}</span></span>
            <input type="range" min="{{ s.min }}" max="{{ s.max }}" step="{{ s.step }}" value="{{ s.val }}" onChange="{{ s.set }}" onInput="{{ s.set }}">
          </label>
        </sc-for>
        <button onClick="{{ resetPhys }}" style="background:transparent;border:1.5px solid #16150F;padding:6px 10px;cursor:pointer;font-size:14px">Varsayılanlara dön</button>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:1000}}">
class Component extends DCLogic {
  state = { mode: 'firlat', team: 0, ch: .5, arrive: .3, power: 1.2, paused: false, tick: 0, phys: {}, qp: {}, srcR: 8, srcD: 1, tutus: 10, kesme: 10, monte: null };
  cv = React.createRef(); cg = React.createRef();
  src = []; ball = null; hist = []; drag = null; hover = null; heat = null; heatKey = ''; pred = null;
  C() { return window.AlanCore; }
  componentDidMount() {
    const w = () => { if (!this.C()) return setTimeout(w, 40); this.setState({ phys: { ...this.C().P }, qp: { ...this.C().Q } }); this.ball = this.C().makeBall({ team: 0, ch: .5 }); this.loop(); };
    w();
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }

    for (let i = 0; i < 200; i++) { const b = C.makeBall({ x: L.x, y: L.y, vx: L.vx, vy: L.vy, team: L.team, ch: L.ch }); let res = null; for (let k = 0; k < 900 && !b.done; k++) { const r = C.stepAll(b, this.src, this.P(), this.Qp(), rnd); if (r && r.took) res = (r.p.team === L.team ? 'Arkadaş tuttu' : r.p.role === 'Bekçi' ? 'Bekçi tuttu' : 'Rakip tuttu'); } const k = res || (b.done === 'durdu' ? (b.alive ? 'Boşta durdu' : 'Söndü') : b.done && b.done.startsWith('kuyu') ? 'Kuyu' : 'Zaman aştı'); R[k] = (R[k] || 0) + 1; }

  loop() {
    const step = () => {

        if (this.seq && this.target && !b.done && Math.hypot(b.x - this.target.x, b.y - this.target.y) < 1.2) { b.done = 'alındı'; b.log.push({ t: b.t, k: 'al', txt: `Arkadaş aldı · varış hızı ${(Math.hypot(b.vx, b.vy) * 60).toFixed(1)} b/sn · enerji %${Math.round(b.e * 100)}` }); this.seqWait = 40; } }
      if (this.seq && b && b.done && this.seqWait != null) { if (--this.seqWait <= 0) { this.seqWait = null; this.runSeq(); } }
      else if (this.seq && b && b.done && this.seqWait == null) { this.seqWait = 40; }
      this.draw(); this.fr = (this.fr || 0) + 1; if (this.fr % 6 === 0) this.setState({ tick: this.fr });

    };
    this.raf = requestAnimationFrame(step);
  }
  pos(e) { const r = this.cv.current.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 100, y: (e.clientY - r.top) / r.height * 50 }; }
  srcAt(p) { let best = null, bd = 2.5; for (const s of this.src) { const d = Math.hypot(s.x - p.x, s.y - p.y); if (d < bd) { bd = d; best = s; } } return best; }
  launch(vx, vy) { const C = this.C(), b = this.ball; this.last = { x: b.x, y: b.y, vx, vy, team: this.state.team, ch: this.state.ch }; this.setState({ monte: null }); this.ball = C.makeBall({ x: b.x, y: b.y, vx, vy, team: this.state.team, ch: this.state.ch }); this.hist = []; this.logN = 0; this.ball.log.push({ t: 0, k: 'start', txt: `Fırlatıldı · hız ${(Math.hypot(vx, vy) * 60).toFixed(0)} birim/sn · şarj %${Math.round(this.state.ch * 100)}` }); this.forceUpdate(); }
  down(e) {
    const p = this.pos(e), m = this.state.mode, C = this.C();
    if (m === 'mavi' || m === 'turuncu' || m === 'bekci') { const s = this.srcAt(p); if (s) this.drag = { kind: 'src', s }; else { this.src.push({ x: p.x, y: p.y, team: m === 'mavi' ? 0 : 1, R: m === 'bekci' ? 7 : this.state.srcR, D: m === 'bekci' ? 1.2 : this.state.srcD, role: m === 'bekci' ? 'Bekçi' : undefined, a: { tutus: this.state.tutus, kesme: this.state.kesme } }); this.heatKey = ''; } return; }

    const b = this.ball; if (Math.hypot(b.x - p.x, b.y - p.y) < 3 || b.done || (!b.vx && !b.vy)) { if (!(Math.hypot(b.x - p.x, b.y - p.y) < 3)) { b.x = p.x; b.y = p.y; b.vx = 0; b.vy = 0; b.done = null; } this.drag = { kind: 'aim', from: { x: b.x, y: b.y }, to: p }; }

  move(e) {

  preset(k) {
    const C = this.C(); this.src = []; this.heatKey = ''; this.seq = null; this.target = null;
    const b = (x, y) => { this.ball = C.makeBall({ x, y, team: 0, ch: this.state.ch }); };
    if (k === 'kisa') { b(40, 25); this.go({ x: 52, y: 25 }); }
    if (k === 'uzun') { b(20, 15); this.go({ x: 62, y: 35 }); }
    if (k === 'blok') { b(40, 25); this.src.push({ x: 50, y: 28, team: 1, R: 8, D: 1 }, { x: 56, y: 19, team: 1, R: 8, D: 1 }, { x: 70, y: 25, team: 0, R: 8, D: 1 }); this.go({ x: 70, y: 25 }); }
    if (k === 'hat') { b(30, 25); this.src.push({ x: 40, y: 26.5, team: 1, R: 8, D: 1 }, { x: 50, y: 25, team: 0, R: 8, D: 1 }); this.go({ x: 50, y: 25 }); }
    if (k === 'bekci') { b(80, 25); this.src.push({ x: 94, y: 25, team: 1, R: 7, D: 1.2, role: 'Bekçi' }); this.launch(2.6 * C.chgMul(this.state.ch, this.P()), 0); }
    if (k === 'sert') { b(30, 25); this.src.push({ x: 42, y: 25, team: 0, R: 8, D: 1 }); const sv = this.state.arrive; this.state.arrive = .9; this.go({ x: 42, y: 25 }); this.state.arrive = sv; }
    if (k === 'akinti') { b(30, 25); this.src.push({ x: 42, y: 25, team: 0, R: 9, D: 1 }, { x: 54, y: 25, team: 0, R: 9, D: 1 }); this.go({ x: 72, y: 25 }); }
    if (k === 'kenar') { b(30, 40); this.src.push({ x: 50, y: 30, team: 1, R: 8, D: 1 }); const v = 1.6; this.launch(v * Math.cos(-.6), v * Math.sin(-.6)); }
    if (k === 'gonder') { b(70, 25); this.src.push({ x: 93, y: 25, team: 1, R: 7, D: 1.2 }); this.launch(2.6 * C.chgMul(this.state.ch, this.P()), 0); }
    if (k === 'plase') { b(75, 32); this.src.push({ x: 93, y: 26, team: 1, R: 7, D: 1.2 }); const dx = 100 - 75, dy = 23.5 - 32, L = Math.hypot(dx, dy), v = 1.7 * C.chgMul(this.state.ch, this.P()); this.launch(dx / L * v, dy / L * v); }

      this.seq = [{ from: { x: 30, y: 25 }, to: { x: 38, y: 38 }, ch: .3 }, { from: { x: 38, y: 38 }, to: { x: 58, y: 12 }, ch: .45 }, { from: { x: 58, y: 12 }, to: { x: 78, y: 36 }, ch: .6 }, { from: { x: 78, y: 36 }, shot: { x: 100, y: 23.6 }, ch: .75 }]; this.seqI = 0; this.runSeq(); }

  runSeq() {

    if (s.shot) { const dx = s.shot.x - s.from.x, dy = s.shot.y - s.from.y, L = Math.hypot(dx, dy), v = 2.6 * C.chgMul(s.ch, this.P()); this.launch(dx / L * v, dy / L * v); this.ball.log.push({ t: 0, k: 'kurgu', txt: `${this.seqI + 1}. hamle · güçlü gönderme, şarj %${Math.round(s.ch * 100)}` }); this.target = null; }
    else { this.go(s.to); this.ball.log.push({ t: 0, k: 'kurgu', txt: `${this.seqI + 1}. hamle · pas, şarj %${Math.round(s.ch * 100)}` }); }

  go(to) { const C = this.C(), sol = C.solveLaunch({ ...this.ball, alive: true, e: C.P.e0 }, to, this.state.arrive, this.src, this.P()); const dx = to.x - this.ball.x, dy = to.y - this.ball.y, L = Math.hypot(dx, dy) || 1; this.launch(dx / L * sol.v0, dy / L * sol.v0); this.target = to; }
  draw() {
    const cv = this.cv.current, C = this.C(); if (!cv || !C) return; const ctx = cv.getContext('2d'), sc = 10, A = '#1F3FD1', B = '#E0531F', INK = '#16150F', team = this.state.team;
    const key = JSON.stringify(this.src) + team; if (key !== this.heatKey) { this.heatKey = key; const oc = this.heat || (this.heat = document.createElement('canvas')); oc.width = 1000; oc.height = 500; const o = oc.getContext('2d'); o.fillStyle = '#F6F3EC'; o.fillRect(0, 0, 1000, 500); for (let y = 0; y < 50; y += 1) for (let x = 0; x < 100; x += 1) { const k = C.K(this.src, x + .5, y + .5, team), ak = Math.abs(k); if (ak < .06) continue; o.globalAlpha = Math.min(.6, ak * .6); o.fillStyle = k > 0 ? A : B; o.fillRect(x * sc, y * sc, sc, sc); } o.globalAlpha = 1; }

    const r = 6 + 6 * b.ch; ctx.fillStyle = b.alive ? (team === 0 ? A : B) : '#9A958A'; ctx.beginPath(); ctx.arc(b.x * sc, b.y * sc, r, 0, 7); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
