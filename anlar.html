<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALAN · Anlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Anlar: farklı tohumlardan, anlatılan sorunların görüldüğü maç anları. Bir ana dokununca canli.html o andan bugünkü motorla oynar. Veri: anlar/anlar.json (arsiv dalındaki anlar araçlarıyla üretilir) */
:root{--bg:#0E0D09;--panel:#16150F;--ink:#F6F3EC;--ink-rgb:246,243,236;--gold:#FFD25A;--mavi:#3D5BF0;--turuncu:#E0531F;--cim:#1B2A1F}
:root[data-tema="gunduz"]{--bg:#F6F7F9;--panel:#FFFFFF;--ink:#12141A;--ink-rgb:18,20,26;--gold:#946600;--cim:#E3EEE5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;background:var(--panel);border-bottom:1px solid rgba(var(--ink-rgb),.1)}
.rozet{font-size:12px;letter-spacing:.16em;font-weight:700;padding:6px 9px;border:1.5px solid var(--ink)}
h1{margin:0;font-size:22px;font-weight:800}
.geri{margin-left:auto;border:1px solid rgba(var(--ink-rgb),.25);border-radius:999px;padding:8px 14px;color:inherit;text-decoration:none;font-size:14px}
main{max-width:1400px;margin:0 auto;padding:16px}
.ust{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.ust p{margin:0;font-size:15px;line-height:1.45;opacity:.85;max-width:780px}
.ust .meta{font-size:12px;opacity:.6}
.cipler{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.cip{border:1px solid rgba(var(--ink-rgb),.22);background:transparent;border-radius:999px;padding:8px 13px;font:inherit;font-size:14px;color:inherit;cursor:pointer;display:flex;gap:7px;align-items:baseline}
.cip.sifir{opacity:.45}
.cip b{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:12px;opacity:.7}
.cip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#0E0D09}
.cip[aria-pressed="true"] b{opacity:.85}
.tur-acik{font-size:14px;opacity:.75;margin:-8px 0 16px;min-height:1em}
.izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.kart{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;background:var(--panel);border:1px solid rgba(var(--ink-rgb),.1);color:inherit;text-decoration:none;transition:border-color .15s}
.kart:hover,.kart:focus-visible{border-color:var(--gold);outline:none}
.kart .bas{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.kart .tur{font-size:12px;letter-spacing:.06em;color:var(--gold);font-weight:600}
.kart .yer{font-size:11px;opacity:.6;white-space:nowrap}
.kart svg{width:100%;height:auto;display:block;border-radius:10px}
.kart .metin{font-size:14px;line-height:1.4;margin:0}
.kart .alt{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.kart .alt span{opacity:.6}
.kart .oyna{color:var(--gold);font-weight:600;font-size:14px}
.bos{padding:40px 0;opacity:.7}
</style>
</head>
<body>
<header>
  <span class="rozet mono">ALAN</span>
  <h1>Anlar</h1>
  <a class="geri" href="canli.html">← Maç</a>
</header>
<main>
  <div class="ust">
    <p>Farklı tohumlarla oynanmış maçlardan, konuştuğumuz sorunların görüldüğü anlar. Bir ana dokun: maç o andan itibaren <b>bugünkü motorla</b> oynar. Motor değiştikçe aynı an yeni davranışla oynar; değişikliği aynı pozisyonda görürsün.</p>
    <span class="meta mono" id="meta">yükleniyor…</span>
  </div>
  <div class="cipler" id="cipler" role="toolbar" aria-label="Sorun türü"></div>
  <p class="tur-acik" id="turAcik"></p>
  <div class="izgara" id="izgara"></div>
</main>
<script>
(function () {
  try { if (localStorage.getItem('alan-oyun-tema') === 'gunduz') document.documentElement.dataset.tema = 'gunduz'; } catch (e) {}
  const RENK = ['#3D5BF0', '#E0531F'], $ = id => document.getElementById(id);
  let V = null, secili = 'hepsi';
  try { secili = localStorage.getItem('alan-anlar-tur') || 'hepsi'; } catch (e) {}
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function saha(k) { // kuşbakışı küçük saha: 120 × 60
    const vur = new Set(k.vurgu), S = [];
    S.push(`<rect x="-3" y="-3" width="126" height="66" fill="var(--cim)"/>`);
    S.push(`<g fill="none" stroke="rgba(var(--ink-rgb),.35)" stroke-width=".35"><rect x="0" y="0" width="120" height="60"/><line x1="60" y1="0" x2="60" y2="60"/><circle cx="60" cy="30" r="7"/><path d="M0 21 A9 9 0 0 1 0 39"/><path d="M120 21 A9 9 0 0 0 120 39"/></g>`);
    if (k.hat) { const x = k.hat.x, g = k.hat.team === 0 ? 0 : 120; S.push(`<rect x="${Math.min(x, g)}" y="0" width="${Math.abs(x - g)}" height="60" fill="var(--gold)" opacity=".1"/><line x1="${x}" y1="0" x2="${x}" y2="60" stroke="var(--gold)" stroke-width=".5" stroke-dasharray="1.5 1.2"/>`); }
    for (const c of k.cizgi || []) { const [x1, y1, x2, y2, tip] = c, st = { pres: 'stroke="var(--gold)" stroke-dasharray="1.4 1"', uzak: 'stroke="rgba(var(--ink-rgb),.7)" stroke-dasharray=".5 1"', bos: 'stroke="#5BD08A" stroke-dasharray="1.4 1"', pas: 'stroke="rgba(var(--ink-rgb),.9)"', kosu: 'stroke="#5BD08A"' }[tip] || 'stroke="var(--gold)"'; S.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${st} stroke-width=".55" stroke-linecap="round"/>`); }
    k.P.forEach((p, i) => { const [x, y, tm, ad, vx, vy, bek] = p, v = vur.has(i);
      if (v) S.push(`<line x1="${x}" y1="${y}" x2="${(x + vx * 9).toFixed(1)}" y2="${(y + vy * 9).toFixed(1)}" stroke="${RENK[tm]}" stroke-width=".5" opacity=".9"/>`);
      if (v) S.push(`<circle cx="${x}" cy="${y}" r="3" fill="none" stroke="var(--gold)" stroke-width=".45"/>`);
      S.push(`<circle cx="${x}" cy="${y}" r="1.7" fill="${RENK[tm]}" stroke="${bek ? 'rgba(var(--ink-rgb),.8)' : 'rgba(0,0,0,.35)'}" stroke-width="${bek ? .4 : .25}"/>`);
      S.push(`<text x="${x}" y="${(y - 2.6).toFixed(1)}" font-size="${v ? 2.9 : 2.2}" text-anchor="middle" fill="var(--ink)" opacity="${v ? 1 : .55}" font-family="JetBrains Mono,monospace" font-weight="${v ? 600 : 400}">${esc(ad)}</text>`); });
    if (k.b) S.push(`<circle cx="${k.b[0]}" cy="${k.b[1]}" r=".95" fill="#FFFFFF" stroke="#000" stroke-width=".2"/>`);
    return `<svg viewBox="-3 -3 126 66" role="img" aria-label="Anın sahası">${S.join('')}</svg>`;
  }
  function ciz() {
    const K = V.KAT, sayAn = {}; for (const a of V.anlar) sayAn[a.kat] = (sayAn[a.kat] || 0) + 1;
    if (secili !== 'hepsi' && !K[secili]) secili = 'hepsi';
    const mac = Math.max(1, V.maclar.length), cip = (kod, ad, n, f) => `<button class="cip${n ? '' : ' sifir'}" data-k="${kod}" aria-pressed="${secili === kod}">${esc(ad)} <b>${n}${f != null ? ' · maçta ' + f : ''}</b></button>`;
    $('cipler').innerHTML = cip('hepsi', 'Hepsi', V.anlar.length) + Object.keys(K).map(k => cip(k, K[k].ad, sayAn[k] || 0, ((V.sayim[k] || 0) / mac).toFixed(1))).join(''); /* hiç görülmeyen tür de durur: 0 = bu taramada bulunmadı */
    $('turAcik').textContent = secili === 'hepsi' ? 'Her türden en belirgin anlar. “maçta” sayısı: o sorunun bir maçta ortalama kaç kez görüldüğü (motor değişince karşılaştırmak için).' : K[secili].acik;
    const L = V.anlar.filter(a => secili === 'hepsi' || a.kat === secili);
    $('izgara').innerHTML = L.length ? L.map(a => `<a class="kart" href="canli.html?an=${encodeURIComponent(a.id)}"><div class="bas"><span class="tur">${esc(K[a.kat].ad)}</span><span class="yer mono">${esc(a.rakip)} · ${a.saat}</span></div>${saha(a.kart)}<p class="metin">${esc(a.metin)}</p><div class="alt"><span class="mono">tohum ${a.tohum} · skor ${a.skor} · ${Math.round((a.t1 - a.t0) / (window.ALAN_TPS || 30))} sn</span><span class="oyna">Oynat →</span></div></a>`).join('') : '<p class="bos">Bu türden an yok.</p>';
  }
  $('cipler').addEventListener('click', e => { const b = e.target.closest('.cip'); if (!b) return; secili = b.dataset.k; try { localStorage.setItem('alan-anlar-tur', secili); } catch (er) {} ciz(); });
  fetch('anlar/anlar.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(v => { V = v; const t = new Date(v.tarih); $('meta').textContent = `${v.maclar.length} maç · ${v.dakika} dk oyun · ${v.anlar.length} an · motor ${v.motor} · ${t.toLocaleDateString('tr-TR')}`; ciz(); }).catch(e => { $('meta').textContent = 'Anlar yüklenemedi: ' + (e.message || e); });
})();
</script>
</body>
</html>
